<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Colonização do espaço · variações offline</title>
<style>
:root{color-scheme:dark;font-family:ui-monospace,Consolas,monospace;background:#302625;color:#e1c0af}*{box-sizing:border-box}body{margin:0;padding:24px}header,.controls,details,footer{max-width:1440px;margin:0 auto}h1{font-size:21px;font-weight:500;margin:0 0 8px}p{margin:0 0 16px;font-size:14px}.controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:16px}button{font:inherit;background:#e1c0af;color:#302625;border:1px solid #e1c0af;padding:9px 16px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}button:focus-visible,input:focus-visible{outline:2px solid #ff6347;outline-offset:3px}#status{font-size:13px;color:#c4b2a7}canvas{display:block;width:100%;height:auto;max-width:1440px;margin:0 auto;border:1px solid #53423d;background:#302625}details{margin-top:16px;font-size:13px}summary{cursor:pointer}label{display:block;margin:12px 0 7px}input{font:inherit;color:#eee;background:#241d1c;border:1px solid #766158;padding:9px;max-width:100%;width:420px}details button{font-size:13px;padding:9px}#parameters{font-size:12px;color:#b5a498;margin-top:10px}footer{font-size:12px;color:#b5a498;margin-top:18px}@media(max-width:600px){body{padding:16px}h1{font-size:18px}.controls{gap:10px}canvas{margin-top:12px}}
</style></head>
<body>
<header><h1>Colonização do espaço</h1><p>Mesmo algoritmo, pequenas variações em cada desenho.</p></header>
<div class="controls"><button id="generate" type="button">Gerar outra</button><span id="status" role="status" aria-live="polite">Preparando…</span></div>
<canvas id="drawing" width="1440" height="900" role="img" aria-label="Micélio gerado pelo algoritmo de colonização do espaço, com dez marcadores vermelhos"></canvas>
<details><summary>Reproduzir um desenho</summary><label for="seed">Semente desta geração</label><input id="seed" autocomplete="off" spellcheck="false"><button id="reproduce" type="button">Reproduzir</button><p id="parameters"></p></details>
<footer>Protótipo offline. Não modifica o site publicado. Uma nova semente é criada ao abrir ou recarregar este arquivo.</footer>
<script>
/* SHARED_ALGORITHM_SOURCE */
const canvas=document.getElementById('drawing'),context=canvas.getContext('2d'),status=document.getElementById('status');
const generateButton=document.getElementById('generate'),reproduceButton=document.getElementById('reproduce'),seedInput=document.getElementById('seed');
let animation=0,generation=0;
function freshSeed(){const value=new Uint32Array(1);crypto.getRandomValues(value);return `ff-space-${Date.now().toString(36)}-${value[0].toString(36)}`;}
function start(seed){
 const token=++generation;cancelAnimationFrame(animation);generateButton.disabled=true;reproduceButton.disabled=true;
 status.textContent='Gerando novo desenho…';seedInput.value=seed;window.currentGrowth={seed,finished:false};
 requestAnimationFrame(()=>requestAnimationFrame(()=>{
  if(token!==generation)return;
  const growth=spaceColonizationVariation(seed),positions=markerPositions(growth.nodes);
  const pins=positions.map(point=>({...point,reveal:Math.max(0,growth.nodes.indexOf(point)-1),visible:false}));
  const p=growth.parameters;
  document.getElementById('parameters').textContent=`${p.nutrientCount} atratores · influência ${p.influence.toFixed(1)} px · consumo ${p.consumption.toFixed(1)} px · avanço ${p.step.toFixed(2)} px`;
  window.currentGrowth={seed,parameters:p,segments:growth.segments.length,markers:pins.length};
  context.fillStyle='#302625';context.fillRect(0,0,1440,900);context.lineCap='round';
  let drawn=0;const perFrame=Math.ceil(growth.segments.length/145);
  generateButton.disabled=false;reproduceButton.disabled=false;status.textContent='Crescendo…';
  function frame(){
   if(token!==generation)return;
   const until=Math.min(growth.segments.length,drawn+perFrame);
   for(;drawn<until;drawn++){
    const line=growth.segments[drawn];context.strokeStyle=`rgba(243,238,226,${line.alpha})`;context.lineWidth=line.width;
    context.beginPath();context.moveTo(line.x,line.y);context.lineTo(line.nx,line.ny);context.stroke();
   }
   for(const pin of pins)if(!pin.visible&&pin.reveal<drawn){pin.visible=true;}
   // Redraw visible pins above newly grown branches.
   for(const pin of pins)if(pin.visible){
    context.beginPath();context.arc(pin.x,pin.y,5,0,Math.PI*2);context.fillStyle='#ff6347';context.fill();context.strokeStyle='#f4eee4';context.lineWidth=1.3;context.stroke();
   }
   if(drawn<growth.segments.length)animation=requestAnimationFrame(frame);
   else{status.textContent='Desenho concluído · 10 marcadores';window.currentGrowth.finished=true;}
  }
  frame();
 }));
}
generateButton.addEventListener('click',()=>start(freshSeed()));
reproduceButton.addEventListener('click',()=>{const seed=seedInput.value.trim();if(seed)start(seed);});
seedInput.addEventListener('keydown',event=>{if(event.key==='Enter')reproduceButton.click();});
start(freshSeed());
</script></body></html>
