# Pages CMS (https://pagescms.org): the editor of fluxusfungus.com.
# Every save is a commit on main, and the Cloudflare build publishes it in up to 2 minutes.

settings:
  commit:
    identity: user

media:
  - name: uploads
    label: Imagens
    input: src/assets/uploads
    output: /src/assets/uploads
    extensions: [jpg, jpeg, png, gif, webp]
    rename: safe
  # Served as is from the site root (public/audio/x.mp3 -> fluxusfungus.com/audio/x.mp3).
  # app.pagescms.org rejects uploads over ~4.5 MB (Vercel body limit, hunvreus/pagescms#393),
  # so a bigger MP3 is uploaded on GitHub into public/audio and then picked here.
  - name: audios
    label: Áudios
    input: public/audio
    output: /audio
    extensions: [mp3]
    rename: safe

content:
  - name: items
    label: Itens do micélio
    description: Cada item aparece como um nó do micélio na página inicial, em ordem aleatória.
    type: collection
    path: src/content/items
    format: yaml
    # Temporary name; the "Assign item ids" GitHub Action renames it to the next number.
    filename: "novo-{year}{month}{day}-{hour}{minute}{second}.yml"
    # The file name is the id in the URL: never rename an existing item.
    operations: { create: true, rename: false, delete: true }
    view:
      fields: [id, title, date, link, show_pt, show_en]
      primary: title
      sort: [id, title]
      search: [title]
      default: { sort: id, order: desc }
    fields:
      - name: id
        label: ID
        description: Preenchido sozinho, até 2 minutos depois de salvar um item novo. É o número do endereço (fluxusfungus.com/p/<ID>).
        type: number
        readonly: true
      - name: title
        label: Nome
        description: Só aparece aqui no editor.
        type: string
        required: true
      - name: link
        label: Link no site
        description: "Preenchido sozinho. Um item novo recebe um número e este link até 2 minutos depois de salvo, e só então aparece no site. Em inglês, o endereço é o mesmo com /en antes de /p/. Se o item não estiver marcado para uma língua, o link dá erro nessa língua."
        type: string
        readonly: true
      - name: date
        label: Data
        description: Dia em que o item entrou no site. Um item novo começa com a data de hoje, e você pode mudar.
        type: date
        options: { format: yyyy-MM-dd }
      - name: show_pt
        label: Mostrar no site em português
        type: boolean
        default: true
      - name: show_en
        label: Mostrar no site em inglês
        type: boolean
        default: true
      - name: content
        label: Conteúdo
        type: block
        blockKey: type
        blocks:
          - name: gallery
            label: Galeria de imagens
            fields:
              - name: pictures
                label: Imagens
                type: object
                list: { min: 1 }
                fields:
                  - name: image
                    label: Imagem
                    type: image
                    required: true
                    options: { media: uploads }
                  - name: caption_pt
                    label: Legenda (pt)
                    type: string
                  - name: subcaption_pt
                    label: Crédito (pt)
                    description: "Por exemplo: Tuane Eggers, 2020"
                    type: string
                  - name: caption_en
                    label: Legenda (en)
                    type: string
                  - name: subcaption_en
                    label: Crédito (en)
                    type: string
          - name: quote
            label: Citação
            fields:
              - name: text_pt
                label: Texto (pt)
                type: rich-text
                options: { format: markdown }
              - name: author_pt
                label: Autoria (pt)
                type: string
              - name: text_en
                label: Texto (en)
                type: rich-text
                options: { format: markdown }
              - name: author_en
                label: Autoria (en)
                type: string
          - name: video
            label: Vídeo
            fields:
              - name: url
                label: Link do Vimeo ou do YouTube
                type: string
                required: true
              - name: caption_pt
                label: Legenda (pt)
                type: string
              - name: subcaption_pt
                label: Crédito (pt)
                description: "Por exemplo: [esporo enviado por Fulana]"
                type: string
              - name: caption_en
                label: Legenda (en)
                type: string
              - name: subcaption_en
                label: Crédito (en)
                description: "Por exemplo: [spore sent by Fulana]"
                type: string
          - name: audio
            label: Áudio
            fields:
              - name: file
                label: Arquivo de áudio (MP3)
                description: "Um MP3 de até 3 MB pode ser enviado aqui. Um arquivo maior, até 25 MB, vai pelo GitHub: abra a pasta public/audio do repositório, clique em Add file → Upload files e confirme. Depois, escolha o arquivo aqui."
                type: file
                required: true
                options: { media: audios }
              - name: caption_pt
                label: Legenda (pt)
                type: string
              - name: subcaption_pt
                label: Crédito (pt)
                description: "Por exemplo: [esporo enviado por Fulana]"
                type: string
              - name: caption_en
                label: Legenda (en)
                type: string
              - name: subcaption_en
                label: Crédito (en)
                description: "Por exemplo: [spore sent by Fulana]"
                type: string

  - name: sobre
    label: Página "sobre"
    type: file
    path: src/content/pages/sobre.yml
    format: yaml
    fields:
      - name: title_pt
        label: Título (pt)
        type: string
        required: true
      - name: content_pt
        label: Texto (pt)
        type: rich-text
        options: { format: markdown }
      - name: title_en
        label: Título (en)
        type: string
        required: true
      - name: content_en
        label: Texto (en)
        type: rich-text
        options: { format: markdown }

  - name: contaminacoes
    label: Página "contaminações"
    type: file
    path: src/content/pages/contaminacoes.yml
    format: yaml
    fields:
      - name: title_pt
        label: Título (pt)
        type: string
        required: true
      - name: content_pt
        label: Texto (pt)
        type: rich-text
        options: { format: markdown }
      - name: title_en
        label: Título (en)
        type: string
        required: true
      - name: content_en
        label: Texto (en)
        type: rich-text
        options: { format: markdown }
