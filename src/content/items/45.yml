title: "Tuane Eggers: Nada é estático. Tudo é fluxo. Se a…"
link: https://fluxusfungus.com/p/45
show_pt: true
show_en: true
content:
  type: quote
  text_pt: "Nada é estático. Tudo é fluxo. Se a arte fala sobre tudo aquilo que permeia a vida, como não falar sobre os fluxos em que a própria vida está inserida? Em silêncio, caminho pelas trilhas da floresta depois de um dia chuvoso. Meus olhos estão atentos e abertos a cada detalhe: é preciso um outro tempo no olhar para encontrar cogumelos. Silenciosos em suas existências pelos cantos úmidos da mata, os fungos sempre me causam um misto de encantamento e de espanto, com suas infinitas possibilidades de formas e de cores. Sua vida misteriosa parece breve aos nossos olhos, mas eles seguem existindo muito além do que somos capazes de captar, transformando e decompondo a matéria como a conhecemos. Quando olho para esses seres que tanto desconheço, sinto como uma dádiva a possibilidade de contemplar sua existência, ao mesmo tempo tão discreta e tão fundamental para a manutenção do equilíbrio da vida no planeta. É nessa sutileza que acontece pelas bordas, de maneira silenciosa, que percebo certa subversão. Enquanto todos dormem, os fungos atuam, em sua própria ontologia, como organismos de interação entre a vida e a morte. Depois do momento de contemplação, o meu impulso seguinte é fotografar. \\[...\\]"
  author_pt: Tuane Eggers
  text_en: "Nothing is static. Everything is flow. If art talks about everything that permeates life, how can we not talk about the flows in which life itself is inserted? In silence, I walk the forest trails after a rainy day. My eyes are attentive and open to every detail: it takes another time to look to find mushrooms. Silent in their existence by the humid corners of the forest, fungi always cause a mixture of enchantment and amazement, with their infinite possibilities of shapes and colors. Their mysterious life seems brief to our eyes, but they continue to exist far beyond what we are capable of capturing, transforming and decomposing matter as we know it. When I look at these beings that I am so unaware of, I feel as a gift the possibility of contemplating their existence, at the same time so discreet and so fundamental for maintaining the balance of life on the planet. It is in this subtlety that happens on the edges, in a silent way, that I perceive a certain subversion. While everyone sleeps, fungi act, in their own ontology, as organisms of interaction between life and death. After the moment of contemplation, my next impulse is to photograph. \\[...\\]"
  author_en: Tuane Eggers
