id: 4
title: "Anna Tsing: Mesmo esse pequeno fato pode nos alertar para…"
link: https://fluxusfungus.com/p/4
date: 2020-10-02
show_pt: true
show_en: true
content:
  type: quote
  text_pt: Mesmo esse pequeno fato pode nos alertar para o quanto nossos pensamentos sobre o conhecimento e a existência apenas assumem uma forma de vida determinada e a velhice como único destino. Nós raramente imaginamos a vida sem esses limites - e quando imaginamos, nos desviamos para a magia. \[...\] E se a nossa forma de vida indeterminada não fosse a forma de nossos corpos, mas sim a forma de nossos movimentos ao longo do tempo? Tal indeterminação expande nosso conceito de vida humana, mostrando-nos como somos transformados pelo encontro. Humanos e fungos compartilham essas transformações do aqui e agora através do encontro. Às vezes, eles se encontram.
  author_pt: Anna Tsing
  text_en: Even this little fact can alert us to how much our thoughts about knowledge and existence just assume determinate life form and old age. We rarely imagine life without such limits - and when we do we stray into magic. \[...\] What if our indeterminate life form was not the shape of our bodies but rather the shape of our motions over time? Such indeterminacy expands our concept of human life, showing us how we are transformed by encounter. Humans and fungi share such here-and-now transformations through encounter. Sometimes they encounter each other.
  author_en: Anna Tsing
