id: 16
title: "Tuane Eggers: Fluxos de sentimentos intensos de alegria & de…"
link: https://fluxusfungus.com/p/16
date: 2020-10-02
show_pt: true
show_en: true
content:
  type: quote
  text_pt: |-
    Fluxos de sentimentos intensos de alegria & de melancolia; risos de felicidade até as lágrimas; tristeza imensa & vontade de chorar; visualização de cores mais vibrantes; alguns efeitos visuais; sensibilidade para os movimentos mais ínfimos, como o vento soprando nas plantas na areia na beira da praia, ou os grãos de areia se movimentando lentamente; sentir-me parte de uma unidade quando os pés afundavam na areia com as ondas do mar; capacidade de visualização de todas as camadas de nuvens; compreensão da passagem do tempo & da impermanência; exaltação da vida; estesia.

    Duração: cerca de 4 horas (ou um tempo infinito).
  author_pt: Tuane Eggers
  text_en: |-
    Flows of intense feelings of joy & melancholy; laughter from happiness to tears; immense sadness & desire to cry; visualization of more vibrant colors; some visual effects; sensitivity to the tiniest movements, such as the wind blowing on plants in the sand on the shore, or the grains of sand moving slowly; to feel part of a unit when my feet sank in the sand with the waves of the sea; ability to view all cloud layers; understanding of the passage of time & impermanence; exaltation of life; esthesia.

    Duration: about 4 hours (or an infinite time).
  author_en: Tuane Eggers
