content:
  type: quote
  text_pt: É impossível experimentar a morte, mas é possível acolher esse impossível na profundeza da vida.
  author_pt: Kuniichi Uno, sobre Hijikata Tatsumi
  text_en: It's impossible to experience death, but it's possible to accept that impossible in the depths of life.
