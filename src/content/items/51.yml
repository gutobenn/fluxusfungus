id: 51
title: "Haicais Fungais, esporos enviados por Cauê Cato: Lepiotáceos Frágeis que são, os elegantes trajes desfazem-se.…"
link: https://fluxusfungus.com/p/51
date: 2020-11-07
show_pt: true
show_en: false
content:
  type: quote
  text_pt: |-
    **Lepiotáceos**

    Frágeis que são,

    os elegantes trajes

    desfazem-se.

    **Pterulaceae**

    Procuram-se aquelas

    que se escondem,

    pequenas ao rés do chão.

    **Lentinoides**

    Não se engane.

    Sabe os cogumelos?

    Primos de família distante.

    **Geastraceae**

    Estrela cadente na terra

    é fungo na certa,

    pedido do orvalho.

    **Fomitporia**

    A hipotenusa perene

    apoiada nos catetos de troncos.

    Triângulo de Pitágoras.

    **Cordyceps (sensu lato)**

    Zumbis não existem.

    Os insetos só querem

    voar de balão.

    **Hygrocybe**

    Luz decomposta

    em cor líquida e vibrante

    prisma micológico.

    **Clavaria**

    Do lado dado

    nas encostas da terra

    um coral sem oceano.

    **Russulaceae**

    Neste toma lá, dá cá,

    a árvore em campanha,

    com fungo, há de melhorar.

    **Cantharellus**

    Origami amarelo

    feito de sol,

    aroma de verão.

    **Antrodia**

    Sobre braços ralados

    e galhos feridos

    as crostas estão vivas.

    **Polyporus**

    Ao longe veem-se

    muitos poros e esporos

    neblina da manhã.

    **Boletoides**

    Lesma faminta

    no hemisfério carnoso,

    paladar que desliza.

    **Phellinus**

    Adorno parasita

    da árvore abandonada

    ígnia cortiça.

    **Amauroderma**

    Morena altitude.

    Acima, bem mais acima

    da elevada relva.

    **Perenniporia**

    Deitadas consomem,

    preguiçosas e avessas,

    o inverso das coisas.

    **Phylloporia**

    Luto em faixa negra

    delimitando o retorno,

    são os ciclos da vida.
  author_pt: Haicais Fungais, esporos enviados por Cauê Cato
