title: "Emanuele Coccia: Tudo está em tudo. Essa mistura faz do…"
show_pt: true
show_en: true
content:
  type: quote
  text_pt: "Tudo está em tudo. Essa mistura faz do mundo e do espaço a realidade de uma transmissibilidade e de uma tradutibilidade universal das formas. Mas o que chamamos de transmissão não é mais que o eco dessa inerência recíproca de toda coisa em toda outra coisa: o mundo é um contágio perpétuo. \\[...\\] Tudo no mundo produz mistura e se produz na mistura. Tudo entra e sai de toda parte: o mundo é abertura, liberdade de circulação absoluta, não lado a lado, mas através dos corpos e dos outros. Viver, experienciar ou estar-no-mundo, significa também se fazer atravessar por toda coisa. Sair de si é sempre entrar em alguma coisa de outro, em suas formas e em sua aura: voltar para dentro de si significa sempre se preparar para encontrar todo tipo de formas, de objetos, de imagens."
  author_pt: Emanuele Coccia
  text_en: "Everything is in everything. This mixture makes the world and space the reality of a transmissibility and a universal translatability of forms. But what we call transmission is nothing more than an echo of this reciprocal inherence of everything in everything else: the world is a perpetual contagion. \\[...\\] Everything in the world produces mixture and is produced in mixture. Everything enters and leaves everywhere: the world is open, absolute freedom of movement, not side by side, but through bodies and others. To live, to experience or to be-in-the-world, also means to be crossed by everything. To leave oneself is always to enter into something from another, in its forms and in its aura: to go back within itself always means to prepare to find all kinds of forms, objects, images."
  author_en: Emanuele Coccia
