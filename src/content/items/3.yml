title: "Ursula K. Le Guin: Para fazer um novo mundo, você começa com…"
link: https://fluxusfungus.com/p/3
show_pt: true
show_en: true
content:
  type: quote
  text_pt: Para fazer um novo mundo, você começa com um antigo certamente. Para achar um mundo, talvez você precise ter perdido um. Talvez você precise estar perdida. A dança da renovação, a dança que criou o mundo, sempre foi dançada nas bordas das coisas, no limite, na costa enevoada.
  author_pt: Ursula K. Le Guin
  text_en: To find a new world, maybe you have to have lost one. Maybe you have to be lost. The dance of renewal, the dance that made world, was always danced here at the edge of things, on the brink, on the foggy coast.
  author_en: Ursula K. Le Guin
