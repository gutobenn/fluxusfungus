id: 2
title: "Anna Tsing: A indeterminação tem um rico legado na apreciação…"
link: https://fluxusfungus.com/p/2
show_pt: true
show_en: true
content:
  type: quote
  text_pt: "A indeterminação tem um rico legado na apreciação humana dos cogumelos. O compositor americano John Cage escreveu um conjunto de peças de curta duração chamado Indeterminação, muitas das quais celebram encontros com cogumelos. Caçar cogumelos silvestres, para Cage, requeria um tipo particular de atenção: atenção ao aqui e agora do encontro, em todas as suas contingências e surpresas."
  author_pt: Anna Tsing
  text_en: "Indeterminacy has a rich legacy in human appreciation of mushrooms. American composer John Cage wrote a set of short performance pieces called Indeterminacy, many of which celebrate encounters with mushrooms. Hunting wild mushrooms, for Cage, required a particular kind of attention: attention to the here and now of encounter, in all its contingencies and surprises."
  author_en: Anna Tsing
