title: "Tuane Eggers: Como habitar o espaço e o tempo de…"
link: https://fluxusfungus.com/p/46
show_pt: true
show_en: true
content:
  type: quote
  text_pt: "Como habitar o espaço e o tempo de uma forma alternativa, em escalas não fixas e não lineares? Como adaptar-se à precariedade que parece ser, de forma cada vez mais clara, a regra e não a exceção destes tempos? Como manter nossas conexões abertas para manter nossos sistemas equilibrados? É possível pensar a arte sob uma perspectiva menos antropocêntrica, criando de forma colaborativa e multiespecífica? Eu penso os fungos, ou os fungos que se manifestam através de mim? Construir zonas de fluxo pode ser uma resposta possível, mas sempre impermanente. Criar rupturas, proporcionar novas relações e movimentar a matéria. Nessas zonas de fluxos, desintegrar a paisagem para perceber sempre outras perspectivas. Uma forma de pensar as possibilidades de um futuro para pensar, principalmente, o presente: estar no presente nos potencializa. \\[...\\]"
  author_pt: Tuane Eggers
  text_en: "How to inhabit space and time in an alternative way, in non-fixed and non-linear scales? How can we adapt to the precariousness that seems to be, increasingly clearly, the rule and not the exception of these times? How do we keep our connections open to keep our systems balanced? Is it possible to think about art from a less anthropocentric perspective, creating in a collaborative and multispecific way? Do I think of the fungi, or the fungi that manifest through me? Building flow zones can be a possible answer, but always impermanent. Create ruptures, provide new relationships and move the matter. In these flow zones, disintegrate the landscape to always perceive other perspectives. One way of thinking about the possibilities of a future to think, mainly, the present: being in the present empowers us. \\[...\\]"
  author_en: Tuane Eggers
