id: 39
title: "Anna Tsing: A precariedade é a condição de estar vulnerável…"
link: https://fluxusfungus.com/p/39
date: 2020-10-30
show_pt: true
show_en: true
content:
  type: quote
  text_pt: A precariedade é a condição de estar vulnerável aos outros. Encontros imprevisíveis nos transformam; não estamos no controle, nem de nós mesmos. Incapazes de contar com uma estrutura estável da comunidade, somos lançados dentro de conjuntos em transformação, que nos refazem e aos nossos outros. Não podemos contar com o status quo; tudo está em fluxo, inclusive nossa capacidade de sobrevivência. \[...\] Indeterminação, a natureza não planejada do tempo é assustadora, mas pensar na precariedade torna evidente que a indeterminação também torna a vida possível.
  author_pt: Anna Tsing
  text_en: Precarity is the condition of being vulnerable to others. Unpredictable encounters transform us; we are not in control, even of ourselves. Unable to rely on a stable structure of community, we are thrown into shifting assemblages, which remake us as well as our others. We can’t rely on the status quo; everything is in flux, including our ability to survive. \[...\] Indeterminacy, the unplanned nature of time , is frightening, but thinking through precarity makes it evident that indeterminacy also makes life possible.
  author_en: Anna Tsing
