id: 7
title: "David Lapoujade, sobre Étienne Souriau: Definitivamente, a filosofia de Souriau talvez seja tanto…"
link: https://fluxusfungus.com/p/7
date: 2020-10-02
show_pt: true
show_en: true
content:
  type: quote
  text_pt: Definitivamente, a filosofia de Souriau talvez seja tanto uma filosofia do direito quanto uma filosofia da arte. Talvez até a arte esteja inteiramente a serviço do direito. Tornar mais reais certas existências, dar a elas uma posição ou um destaque particular, não é um meio de legitimar sua maneira de ser, de lhes conferir o direito de existir sob determinada forma?
  author_pt: David Lapoujade, sobre Étienne Souriau
  text_en: Definitely, Souriau's philosophy is perhaps as much a philosophy of law as a philosophy of art. Perhaps even art is entirely at the service of law. Is making certain existences more real, giving them a particular position or prominence, is it not a means of legitimizing their way of being, of giving them the right to exist in a certain form?
  author_en: David Lapoujade, about Étienne Souriau
