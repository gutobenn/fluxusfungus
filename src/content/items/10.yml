id: 10
title: "John Cage: Não há sentido em querer compreender os cogumelos.…"
link: https://fluxusfungus.com/p/10
show_pt: true
show_en: true
content:
  type: quote
  text_pt: Não há sentido em querer compreender os cogumelos. Eles escapam à nossa erudição. Quanto mais se sabe sobre eles, menos certeza você tem de identificá-los.
  author_pt: John Cage
  text_en: It's useless to pretend to know mushrooms. They escape your erudition. The more you know them, the less sure you feel about identifying them.
  author_en: John Cage
