title: A poética dos fungos - intervenção urbana no 6º Festival Kino Beat
link: https://fluxusfungus.com/p/50
date: 2020-11-04
show_pt: true
show_en: true
content:
  type: gallery
  pictures:
    - image: /src/assets/uploads/Alt_20191210_Kino_Beat_0079_34e6cdf6d2.jpg
      caption_pt: A poética dos fungos - intervenção urbana no 6º Festival Kino Beat
      subcaption_pt: |-
        Nesta ação de intervenção urbana, foram escolhidos locais não usuais para trabalhos artísticos. Ao utilizar um espaço comumente publicitário, escolhemos subverter a lógica comercial que rege o mundo. É preciso transformar a matéria: a matéria física, a matéria do pensamento, a matéria do olhar. Como ressalta a antropóloga Anna Tsing, os fluxos mobilizados pela digestão micelial são, ao mesmo tempo, narrativas de degradação e criação. A decomposição que configura ou torna possível novos mundos para outros organismos. 

        Registro fotográfico de Fábio Alt.
      caption_en: The poetics of fungi - urban intervention at 6º Kino Beat Festival
      subcaption_en: |-
        In this urban intervention action, unusual places were chosen for artistic works. By using a commonly advertising space, we choose to subvert the commercial logic that rules the world. It is necessary to transform matter: physical matter, matter of thought, matter of look. As anthropologist Anna Tsing points out, the flows mobilized by mycelial digestion are, at the same time, narratives of degradation and creation. The decomposition that configures or makes possible new worlds for other organisms. 

        Photographic register by Fábio Alt.
