id: 8
title: "Emanuele Coccia: Identificar natureza e cosmos significa antes de tudo…"
link: https://fluxusfungus.com/p/8
show_pt: true
show_en: true
content:
  type: quote
  text_pt: Identificar natureza e cosmos significa antes de tudo fazer da natureza não um princípio separado, mas aquilo que se exprime em tudo o que é. Inversamente, o mundo não é o conjunto lógico de todos os objetos, nem uma totalidade metafísica dos seres, mas a força física que atravessa tudo o que se engendra e se transforma.
  author_pt: Emanuele Coccia
  text_en: To identify nature and the cosmos means, above all, to make nature not a separate principle, but what is expressed in all that is. Inversely, the world is not the logical set of all objects, nor a metaphysical totality of beings, but the physical force that exists through everything that is engendered and transformed.
  author_en: Emanuele Coccia
