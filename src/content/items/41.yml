id: 41
title: "Kuniichi Uno, sobre Hijikata Tatsumi: A percepção não cessa de extrair um mundo…"
link: https://fluxusfungus.com/p/41
date: 2020-10-30
show_pt: true
show_en: true
content:
  type: quote
  text_pt: A percepção não cessa de extrair um mundo percebido a partir de um universo infinito, de medir as distâncias que são as relações com o mundo. As distâncias não cessam de variar. O mundo é sempre constituído pela profundidade imperceptível, imensurável. A forma e o tamanho são extraídos apenas dessa profundidade invisível, inaudível, imperceptível. \[...\] Podemos apenas medir a intensidade quando estamos diante de um caos desmedido, imensurável. Não entender, apenas medir. É preciso observar, principalmente, ‘aquilo que aparece apenas lá onde o visível se desfaz’.
  author_pt: Kuniichi Uno, sobre Hijikata Tatsumi
  text_en: Perception does not cease to extract a perceived world from an infinite universe, to measure the distances that are the relations with the world. The distances do not cease to vary. The world is always constituted by the imperceptible, immeasurable depth. The shape and size are extracted only from that invisible, inaudible, imperceptible depth. \[...\] We can only measure the intensity when we are faced with immeasurable, immeasurable chaos. Don't understand, just measure. It is necessary to observe, mainly, ‘what appears only where the visible falls apart’.
  author_en: Kuniichi Uno, about Hijikata Tatsumi
