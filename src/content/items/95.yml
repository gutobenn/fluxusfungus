content:
  type: quote
  text_pt: "O micélio descreve o mais comum dos hábitos de fungos, melhor pensado não como uma coisa, mas como um processo: uma tendência exploratória e irregular."
  author_pt: Merlin Sheldrake
  text_en: "Mycelium describes the most common of fungal habits, better thought of not as a thing but as a process: an exploratory, irregular tendency."
  author_en: Merlin Sheldrake
