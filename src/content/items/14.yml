id: 14
title: "Donna Haraway: Nós relacionamos, conhecemos, pensamos, criamos mundos e contamos…"
link: https://fluxusfungus.com/p/14
show_pt: true
show_en: true
content:
  type: quote
  text_pt: Nós relacionamos, conhecemos, pensamos, criamos mundos e contamos histórias através e com outras histórias, mundos, conhecimentos, pensamentos, anseios. O mesmo acontece com todas as outras criaturas da Terra, em toda a nossa diversidade alegre de especulações e obstáculos que quebram categorias. Outras palavras para isso poderiam ser materialismo, evolução, ecologia, simpoiese, história, conhecimentos situados, desempenho cosmológico, mundo da arte científica ou animismo, completos com todas as contaminações e infecções conjuntas por cada um desses termos. As criaturas estão em jogo umas com as outras em cada mistura e rotação da pilha de composto terrano. Somos compostos, não pós-humanos; habitamos as humusidades, não as humanidades. Filosoficamente e materialmente, sou uma compositora, não uma pós-humanista. Criaturas - humanas ou não - tornam-se umas com as outras, se compõem e se decompõem, em todas as escalas e registros de tempo e outras coisas em emaranhados simpoiéticos, no mundo terrestre e no mundo do desenvolvimento evolucionário ecológico.
  author_pt: Donna Haraway
  text_en: We relate, know, think, world, and tell stories through and with other stories, worlds, knowledges, thinking, yearnings. So do all the other critters of Terra, in all our bumptious diversity and category-breaking speciations and knottings. Other worlds for this might be materialism, evolution, ecology, sympoiesis, history, situated knowledges, cosmological performance, sciente art worldings, or animism, complete with all the contaminations and infections conjured by each of these terms. Critters are at stake in each other in every mixing and turning of the terran compost pile. We are compost, non posthuman; we inhabit the humusities, not the humanities. Philosophically and materially, I am a compostist, not a posthumanist. Critters - human and not - become with each other, compose and decompose each other, in every scale and register of time and stuff in sympoietic tangling, in ecological evolutionary developmental earthly worlding and unworlding.
  author_en: Donna Haraway
