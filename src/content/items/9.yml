title: "Anna Tsing: Como um encontro se torna um “acontecimento”, isto…"
show_pt: true
show_en: true
content:
  type: quote
  text_pt: Como um encontro se torna um “acontecimento”, isto é, maior que a soma de suas partes? Uma resposta é contaminação. Estamos contaminados pelos nossos encontros; eles mudam quem somos enquanto abrimos caminho para os outros. À medida que a contaminação muda os projetos de criação de mundos, mundos mútuos - e novas direções - podem emergir. Todo mundo carrega uma história de contaminação; a pureza não é uma opção. A importância de manter a precariedade em mente é que nos faz lembrar que mudar de acordo com as circunstâncias é essencial para a sobrevivência.
  author_pt: Anna Tsing
  text_en: How does a gathering become a ‘happening’, that is, greater than a sum of its parts? One answer is contamination. We are contaminated by our encounters; they change who we are as we make way for others. As contamination changes world-making projects, mutual worlds - and new directions - may emerge. Everyone carries a history of contamination; purity is not an option. One value of keeping precarity in mind is that it makes us remember that changing with circumstances is the stuff of survival.
  author_en: Anna Tsing
