title: "Emily Dickinson (c. 1874) · Tradução de Adalberto Müller [de Poesia completa de Emily Dickinson, v. 2, Folhas Soltas. Brasília; Campinas: Editora UnB; Editora Unicamp, 2021 - no prelo] · esporo enviado por Adalberto Müller: O Cogumelo Cogumelo é o Elfo das Plantas…"
show_pt: true
show_en: true
content:
  type: quote
  text_pt: |-
    **O Cogumelo**

    Cogumelo é o Elfo das Plantas –

    De Noite, ele não é –

    De Manhã, Chapéu de Trufa,

    Em qualquer lugar, de Pé

    Ele quer ficar à toa

    Mas sua Carreira inteira

    É menor que atraso de Cobra –

    Ou vida de Erva rasteira –

    É o Bufão da Vegetação –

    É de um Álibi o Germe –

    Como Bolha, aparece

    E como Bolha, some –

    Eu sinto que a Grama gosta

    De ver como se intromete

    Este sub-reptício Rebento

    De um Verão circunspecto.

    Se a Natureza desse mole

    A ponto de desprezá-lo –

    Se Ela tivesse um Apóstata –

    Esse seria – o Cogumelo!
  author_pt: "Emily Dickinson (c. 1874) · Tradução de Adalberto Müller [de Poesia completa de Emily Dickinson, v. 2, Folhas Soltas. Brasília; Campinas: Editora UnB; Editora Unicamp, 2021 - no prelo] · esporo enviado por Adalberto Müller"
  text_en: |-
    **The Mushroom**

    The Mushroom is the Elf of Plants —

    At Evening, it is not —

    At Morning, in a Truffled Hut

    It stop upon a Spot

    As if it tarried always

    And yet its whole Career

    Is shorter than a Snake's Delay

    And fleeter than a Tare —

    'Tis Vegetation's Juggler —

    The Germ of Alibi —

    Doth like a Bubble antedate

    And like a Bubble, hie —

    I feel as if the Grass was pleased

    To have it intermit —

    This surreptitious scion

    Of Summer's circumspect.

    Had Nature any supple Face

    Or could she one contemn —

    Had Nature an Apostate —

    That Mushroom — it is Him!
  author_en: Emily Dickinson (c. 1874) · spore sent by Adalberto Müller
