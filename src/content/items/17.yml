    - image: /src/assets/uploads/relacao_fungo_prototaxite_2_d854ad927f.jpg
      caption_pt: Estudos sobre fungos & montanhas, Tuane Eggers, 2020
      subcaption_pt: "Análise microscópica de um ser do gênero Prototaxites (que descreve organismos terrestres conhecidos apenas a partir de fósseis datados do Siluriano e Devoniano, há aproximadamente 420 a 370 milhões de anos). Eles formavam grandes estruturas semelhantes a troncos com largura de até 1 metro e com altura de até 8 metros. As suspeitas sobre os Prototaxites é de que sejam pertencentes ao Reino Fungi. Algumas hipóteses apontam para uma alga simbionte, sendo assim um gênero de líquen. A semelhança visual entre as camadas que compõem ambas as imagens me faz pensar: quantas camadas de seres compõem o mundo?"
      caption_en: Studies on fungi & mountains, Tuane Eggers, 2020
      subcaption_en: "Microscopic analysis of a being of the genus Prototaxites (which describes terrestrial organisms known only from fossils dating from Silurian and Devonian, approximately 420 to 370 million years ago). They formed large log-like structures with a width of up to 1 meter and a height of up to 8 meters. The suspicions about Prototaxites are that they belong to the Fungi Kingdom. Some hypotheses point to a symbiotic alga, thus being a genus of lichen. The visual similarity between the layers that make up both images makes me wonder: how many layers of beings make up the world?"
