id: 99
title: "Merlin Sheldrake: Imagine se você pudesse passar por duas portas…"
link: https://fluxusfungus.com/p/99
date: 2021-03-10
show_pt: true
show_en: true
content:
  type: quote
  text_pt: Imagine se você pudesse passar por duas portas ao mesmo tempo. É inconcebível, mas os fungos fazem isso o tempo todo. Quando confrontadas com um caminho bifurcado, as hifas fúngicas não precisam escolher um ou outro. Elas podem se ramificar e tomar as duas rotas.
  author_pt: Merlin Sheldrake
  text_en: Imagine that you could pass through two doors at once. It’s inconceivable, yet fungi do it all the time. When faced with a forked path, fungal hyphae don’t have to choose one or the other. They can branch and take both routes.
  author_en: Merlin Sheldrake
