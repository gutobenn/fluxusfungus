id: 1
title: "Robin Wall Kimmerer: Minha primeira prova de perda da linguagem foi…"
link: https://fluxusfungus.com/p/1
show_pt: true
show_en: true
content:
  type: quote
  text_pt: Minha primeira prova de perda da linguagem foi com a palavra Puhpowee na minha língua. Eu topei com um livro da etnobotânica anishinaabe Keewaydinoquay, em um tratado sobre usos tradicionais de fungos por nosso povo. \[Puhpowee\] traduz ‘a força que faz com que os cogumelos se levantem da terra durante a noite’. Como uma bióloga, eu fiquei perplexa que esta palavra existisse. Em todo seu vocabulário técnico, a ciência ocidental não tem este termo, não tem nenhuma palavra para se referir a este mistério. Você poderia pensar que os biólogos, de todas as pessoas, teriam palavras para a vida. Mas, em linguagem científica, nossa terminologia é usada para definir os limites de nosso conhecimento. O que está além do nosso alcance permanece sem nome.
  author_pt: Robin Wall Kimmerer
  text_en: My first taste of the missing language was the word Puhpowee on my tongue. I stumbled upon it in a book by the Anishinaabe ethnobotanist Keewaydinoquay, in a treatise on the traditional uses of fungi by our people. Puhpowee, she explained, translates as “the force which causes mushrooms to push up from the earth overnight.” As a biologist, I was stunned that such a word existed. In all its technical vocabulary, Western science has no such term, no words to hold this mystery. You’d think that biologists, of all people, would have words for life. But in scientific language our terminology is used to define the boundaries of our knowing. What lies beyond our grasp remains unnamed.
  author_en: Robin Wall Kimmerer
