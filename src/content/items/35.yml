id: 35
title: "David Lapoujade, sobre Étienne Souriau: Onde encontrar em si mesmo os recursos para…"
link: https://fluxusfungus.com/p/35
show_pt: true
show_en: true
content:
  type: quote
  text_pt: "Onde encontrar em si mesmo os recursos para legitimar determinado modo de existência singular? Como tornar as existências mais reais? Talvez as existências devam se submeter a outras existências para se colocarem elas mesmas ou se consolidarem, e inversamente. Não existimos por nós mesmos; só existimos realmente porque fazemos existir outra coisa. Toda existência precisa de intensificadores para aumentar sua realidade. Um ser não pode conquistar o direito de existir sem a ajuda de outro, que ele faz existir. Será esse, justamente, o papel do advogado» intensificar a realidade das existências? Lutar por novos direitos? É uma questão de direito, mas é mais do que nunca a questão da arte: através de que “gestos” instauradores as existências conseguem se “colocar” legitimamente?"
  author_pt: David Lapoujade, sobre Étienne Souriau
  text_en: "Where to find in itself the resources to legitimize a particular mode of existence? How to make existences more real? Perhaps existences must submit to other existences in order to place themselves or consolidate themselves, and vice versa. We do not exist by ourselves; we only really exist because we make something else exist. Every existence needs intensifiers to increase its reality. One being cannot earn the right to exist without the help of another, which he makes exist. Is this, precisely, the role of the lawyer »to intensify the reality of existences? Fight for new rights? It is a question of law, but it is more than ever the question of art: through what instating “gestures” are existences able to legitimately “place” themselves?"
  author_en: David Lapoujade, about Étienne Souriau
