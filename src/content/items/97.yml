title: "Merlin Sheldrake: O micélio de muitos fungos pode fundir-se com…"
link: https://fluxusfungus.com/p/97
date: 2021-02-02
show_pt: true
show_en: true
content:
  type: quote
  text_pt: O micélio de muitos fungos pode fundir-se com outras redes miceliais se forem geneticamente semelhantes o suficiente, mesmo que não sejam sexualmente compatíveis. A identidade própria dos fungos é importante, mas nem sempre é um mundo binário. O eu pode se transformar em alteridade gradualmente.
  author_pt: Merlin Sheldrake
  text_en: The mycelium of many fungi can fuse with other mycelial networks if they are genetically similar enough, even if they aren’t sexually compatible. Fungal self-identity matters, but it is not always a binary world. Self can shade off into otherness gradually.
  author_en: Merlin Sheldrake
