title: "Paul Stamets: O que há de mais emocionante na micologia…"
link: https://fluxusfungus.com/p/11
show_pt: true
show_en: true
content:
  type: quote
  text_pt: O que há de mais emocionante na micologia é que a profundidade do conhecimento não descoberto que se apresenta diante de nós é mais vasta do que nossas mentes podem imaginar.
  author_pt: Paul Stamets
  text_en: What is so exciting about mycology is that the depth of undiscovered knowledge laying before us is more vast than our minds can imagine.
  author_en: Paul Stamets
