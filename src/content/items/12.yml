title: "Paul Stamets: À medida que massas terrestres e cadeias de…"
show_pt: true
show_en: true
content:
  type: quote
  text_pt: À medida que massas terrestres e cadeias de montanhas se formam, gerações sucessivas de plantas e animais nascem, vivem e morrem. Os fungos são espécies-chave que criam camadas de solo cada vez mais espessas, que permitem que as gerações futuras de plantas e animais floresçam. Sem fungos, todos os ecossistemas falhariam.
  author_pt: Paul Stamets
  text_en: As land masses and mountain ranges form, successive generations of plants and animals are born, live, and die. Fungi are keystone species that create ever-thickening layers of soil, which allow future plant and animal generations to flourish. Without fungi, all ecosystems would fail.
  author_en: Paul Stamets
