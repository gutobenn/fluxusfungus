id: 40
title: "Peter McCoy: As redes miceliais não apenas são expressões emergentes…"
link: https://fluxusfungus.com/p/40
date: 2020-10-30
show_pt: true
show_en: true
content:
  type: quote
  text_pt: As redes miceliais não apenas são expressões emergentes em si mesmas, mas também estão intimamente ligadas ao comportamento emergente em seus ecossistemas. \[...\] Através de uma lente micelial, as várias facetas da vida podem ser vistas holisticamente, permitindo a criação de modelos que respondem por variáveis ​​em vários sistemas de maneira metódica e natural. \[...\] Uma vez que o pensamento micelial é aprendido, é impossível não influenciar todas as atividades de alguém. As conexões se formam facilmente e, no entanto, permanecem maleáveis ​​o suficiente para serem revisadas à medida que novas informações surgem. À medida que as ações desse processo de pensamento adaptativo afetam o mundo, elas são construídas por outros, criando um ciclo de feedback em toda a comunidade.
  author_pt: Peter McCoy
  text_en: Not only are mycelial networks emergent expressions in and of themselves, they are also intimately linked to the emergent behavior in their ecosystems. \[...\] Through a mycelial lens, life's various facets can be seen holistically, enabling one to create models that account for variables across numerous systems in a manner that is methodical, yet natural. \[...\] Once the mycelial thought is learned, it is impossible for it to not influence all of one's activities. Connections form easily and yet stay malleable enough to be revised as new information emerges. As the actions of this adaptive thinking process go on to affect the world, they are built upon by others, creating a feedback loop throughout a community.
  author_en: Peter McCoy
