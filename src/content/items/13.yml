title: "Tatsumi Hijikata: Alguma coisa muito nostálgica, que cresce de maneira…"
link: https://fluxusfungus.com/p/13
show_pt: true
show_en: true
content:
  type: quote
  text_pt: Alguma coisa muito nostálgica, que cresce de maneira insignificante e entra na humanidade. \[...\] Aquilo que é enorme e o que é insignificante se misturam. Esta é a realidade.
  author_pt: Tatsumi Hijikata
  text_en: Something very nostalgic, that grows insignificantly and enters humanity. \[...\] What is huge and what is insignificant mix. This is the reality.
  author_en: Tatsumi Hijikata
