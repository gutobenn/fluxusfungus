title: "Peter McCoy: Assim, sem idade ou tamanho predeterminados, os fungos…"
show_pt: true
show_en: true
content:
  type: quote
  text_pt: Assim, sem idade ou tamanho predeterminados, os fungos não são limitados por restrições de tempo e espaço. Eles são viajantes do tempo e seres metamórficos do mundo, que carregam a história da Terra em seu DNA através das grandes extinções do passado. Como nos encontramos agora em meio a um dos tempos mais tumultuados da história humana, é necessário humildade para prestar atenção nas lições desses antigos guardiões do mundo, e explorar os padrões que eles sempre expressaram sobre a natureza, vivendo de acordo com seus princípios.
  author_pt: Peter McCoy
  text_en: Thus, with no predetermined or maximal age or size, fungi are unbound by the constraints of time and space. They are the time travelers and shapeshifters of the world who have carried the history of the Earth in their DNA through all the great extinctions of the past. As we now find ourselves in the midst of one of the most tumultuous times in human history, humility is needed to heed the lessons of these ancient keepers of the world, and to explore the patterns that they have always expressed about Nature and ofliving in accord with its principles.
  author_en: Peter McCoy
