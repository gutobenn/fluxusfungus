id: 96
title: "Merlin Sheldrake: Falar sobre indivíduos não faz mais sentido. A…"
link: https://fluxusfungus.com/p/96
date: 2021-02-02
show_pt: true
show_en: true
content:
  type: quote
  text_pt: Falar sobre indivíduos não faz mais sentido. A biologia — o estudo dos organismos vivos — se transformou em ecologia — o estudo das relações entre os organismos vivos. Para complicar as coisas, entendemos muito pouco. Os gráficos das populações microbianas projetadas em uma tela tinham grandes seções marcadas como "desconhecidas". Lembrei-me da maneira como os físicos modernos retratam o universo, mais de noventa e cinco por cento dos quais são descritos como "matéria escura" e "energia escura". A matéria escura e a energia são escuras porque não sabemos nada sobre elas. Isso era matéria escura biológica, ou vida escura.
  author_pt: Merlin Sheldrake
  text_en: To talk about individuals made no sense anymore. Biology— the study of living organisms—had transformed into ecology—the study of the relationships between living organisms. To compound matters, we understood very little. Graphs of microbial populations projected on a screen had large sections labeled “unknown.” I was reminded of the way that modern physicists portray the universe, more than ninety-five percent of which is described as “dark matter” and “dark energy.” Dark matter and energy are dark because we don’t know anything about them. This was biological dark matter, or dark life.
  author_en: Merlin Sheldrake
