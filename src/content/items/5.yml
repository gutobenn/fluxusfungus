title: "Henri Bergson: A mudança, se consentirem em olhar para ela…"
show_pt: true
show_en: true
content:
  type: quote
  text_pt: A mudança, se consentirem em olhar para ela diretamente, sem véu interposto, logo lhes aparecerá como o que pode haver de mais substancial e duradouro no mundo. Sua solidez é infinitamente superior à de uma fixidez que não passa de um arranjo efêmero entre mobilidades.
  author_pt: Henri Bergson
  text_en: The change, if they consent to look at it directly, without an intervening veil, will soon appear to them as the most substantial and lasting thing in the world. Its solidity is infinitely superior to that of a fixity that is only an ephemeral arrangement between mobilities.
  author_en: Henri Bergson
