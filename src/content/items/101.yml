id: 101
title: Encontrei esses seres mágicos em uma trilha de férias no sul da França, no verão passado. Não sou especialista em fungos, mas me sinto fascinada por suas formas e cores, e como eles fazem parte do ecossistema florestal. O mundo da floresta parece muito mais organizado do que o mundo humano - adoro como as árvores parecem se comunicar com os fungos e, aparentemente, ajudam uns aos outros a sobreviver. Um modelo sábio e excelente para todos nós.
link: https://fluxusfungus.com/p/101
show_pt: true
show_en: true
content:
  type: gallery
  pictures:
    - image: /src/assets/uploads/Vacances_tarn016_1839df22e0.jpg
      caption_pt: Encontrei esses seres mágicos em uma trilha de férias no sul da França, no verão passado. Não sou especialista em fungos, mas me sinto fascinada por suas formas e cores, e como eles fazem parte do ecossistema florestal. O mundo da floresta parece muito mais organizado do que o mundo humano - adoro como as árvores parecem se comunicar com os fungos e, aparentemente, ajudam uns aos outros a sobreviver. Um modelo sábio e excelente para todos nós.
      subcaption_pt: "[esporo enviado por Clémentine Blue]"
      caption_en: |-
        I encountered these magical beings on a holiday trail in the south of France, last summer.
        I am no fungi specialist but I feel fascinated by their shape and colours, and how they are part of the forest eco-system. The forest world seems way better organized than the human world - I love how trees seem to communicate with fungi and apparently help each other survive. A wise, great model for us all.
      subcaption_en: "[spore sent by Clémentine Blue]"
