content:
  type: gallery
  pictures:
    - image: /src/assets/uploads/IMG_5707_3_8717be2c02.jpg
      caption_pt: Sobre contaminações
      subcaption_pt: 'Há algum tempo encontrei esses seres fúngicos em algum passeio na floresta e decidi guardá-los em um vidro para compor uma obra da série Estudos sobre fungos & montanhas, em uma exposição coletiva. Há alguns dias, quando conferi o vidro guardado aqui, percebi que os fungos estavam contaminados por outros seres. Sempre lembro do filósofo Emanuele Coccia, em seu maravilhoso livro A vida das plantas: "Tudo está em contato com tudo, e uma lenta circulação das matérias e dos sumos permite a todos viver bem além dos limites de seus corpos. Tudo respira, mas de maneira diferente do mundo aéreo. O sopro dos corpos, aliás, não precisa passar por pulmões - nem por órgãos: todo corpo é definido por seu sopro, todo corpo é um porto aberto à circulação da matéria - dentro e fora de si. O organismo não é mais que a invenção de uma maneira nova de se misturar com o mundo e de permitir ao mundo se misturar dentro dele."'
      caption_en: About contaminations
      subcaption_en: 'Some time ago I met these fungal beings on a walk in the forest and decided to keep them in a glass to compose a work from the series Studies on fungi & mountains, in a group exhibition. A few days ago, when I checked the glass stored here, I realized that the fungi were contaminated by other beings. I always remember the philosopher Emanuele Coccia, in his wonderful book The Life of Plants: "Everything is in contact with everything, and a slow circulation of materials and juices allows everyone to live well beyond the limits of their bodies. Everything breathes, but differently from the aerial world, the breath of bodies, moreover, does not need to pass through lungs - or organs: every body is defined by its breath, every body is a port open to the circulation of matter - inside and outside itself. it is nothing more than the invention of a new way of mixing with the world and allowing the world to blend into it."'
