title_pt: sobre
content_pt: |-
  Nada é estático. Tudo é fluxo.
  **Fluxus Fungus** é um projeto da artista visual [Tuane Eggers](http://www.tuaneeggers.com) [baseada em Porto Alegre/RS, Brasil] e surge como resultado das investigações de sua pesquisa intitulada [A Poética dos Fungos](https://static.fluxusfungus.com/a%20po%C3%A9tica%20dos%20fungos.pdf), no mestrado em Poéticas Visuais, no [Programa de Pós-Graduação em Artes Visuais [PPGAV] ](https://www.ufrgs.br/ppgav) da Universidade Federal do Rio Grande do Sul [UFRGS], em 2020. 

  O site foi desenvolvido por [Augusto Bennemann](https://augusto.dev), a partir de conceito visual de [Dani Eizirik](http://www.riacho.me), e possui código-fonte aberto, disponível [aqui](https://github.com/gutobenn/fluxusfungus). A cada acesso, o micélio surge em um ponto diferente da tela, movido pela indeterminação e imprevisibilidade dos esporos fúngicos, assim como os conteúdos que o compõem — incerteza viva como impulso de criação. A cada dez conteúdos visualizados, surge a possibilidade de abrir um novo micélio com outros esporos. A música é [Pulse, de Project Mycelium](https://projectmycelium.bandcamp.com/album/pulse).

  O projeto foi contemplado pelo Edital FAC Digital RS [ [www.cultura.rs.gov.br](https://www.cultura.rs.gov.br) / [www.feevale.br](https://www.feevale.br) / [www.feevaletechpark.com.br](https://www.feevaletechpark.com.br)] e selecionado no [67º Salão Paranaense de Arte Contemporânea](http://www.mac.pr.gov.br/Pagina/Salao-Paranaense), promovido pelo Museu de Arte Contemporânea do Paraná. O apoio é do Instituto de Artes da UFRGS e da Coordenação de Aperfeiçoamento de Pessoal de Nível Superior [CAPES]. 

  //

  Pesquisa: Tuane Eggers

  Orientação: Eduardo Figueiredo Vieira da Cunha

  Desenvolvimento do site: Augusto Bennemann

  Conceito visual: Dani Eizirik

  Música: Pulse, de Project Mycelium

  ![linhas logos.png](https://res.cloudinary.com/txtr/image/upload/v1602628404/linhas_logos_8011a91a7f.png)
title_en: about
content_en: |-
  Nothing is static. Everything is flow.
  **Fluxus Fungus** is a project by visual artist [Tuane Eggers](http://www.tuaneeggers.com) [based in Porto Alegre/RS, Brazil] and emerges as a result of the investigations of his research entitled The Poetics of Fungi, in the master's degree in Visual Poetics, in the [Postgraduate Program in Visual Arts [PPGAV]](https://www.ufrgs.br/ppgav) of the University Federal University of Rio Grande do Sul [UFRGS] in 2020.

  The website was developed by [Augusto Bennemann](https://augusto.dev), based on a visual concept by [Dani Eizirik](http://www.riacho.me), and has an open-source code, available [here](https://github.com/gutobenn/fluxusfungus). At each access, the mycelium appears at a different point on the screen, moved by the indeterminacy and unpredictability of fungal spores, as well as the contents that compose it - living uncertainty as a creative impulse. For every ten contents viewed, the possibility arises of opening a new mycelium with other spores. The song is [Pulse, by Project Mycelium](https://projectmycelium.bandcamp.com/album/pulse).

  The project was contemplated by the Edital FAC Digital RS [ [www.cultura.rs.gov.br](https://www.cultura.rs.gov.br) / [www.feevale.br](https://www.feevale.br) / [www.feevaletechpark.com.br](https://www.feevaletechpark.com.br)] and selected at the [67th Salão Paranaense de Arte Contemporânea](http://www.mac.pr.gov.br/Pagina/Salao-Paranaense), promoted by the Museum of Contemporary Art of Paraná. Support is provided by Instituto de Artes of UFRGS and the Coordenação de Aperfeiçoamento de Pessoal de Nível Superior [CAPES].

  //

  Research: Tuane Eggers

  Orientation: Eduardo Figueiredo Vieira da Cunha

  Website development: Augusto Bennemann

  Visual concept: Dani Eizirik

  Music: Pulse, by Project Mycelium

