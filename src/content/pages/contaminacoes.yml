title_pt: contaminações
content_pt: |-
  *E se a nossa forma de vida indeterminada não fosse a forma de nossos corpos, mas sim a forma de nossos movimentos ao longo do tempo? Tal indeterminação expande nosso conceito de vida humana, mostrando-nos como somos transformados pelo encontro. Humanos e fungos compartilham essas transformações do aqui e agora através do encontro. Às vezes, eles se encontram.* [Anna Tsing]


  Meu encantamento pelos fungos se deu, inicialmente, de forma visual. À medida em que me aprofundo nesse universo, percebo que se intensifica também o mistério que o circunda — e meu encantamento se amplia. Ao longo dessa caminhada pela floresta que envolve o percurso de uma pesquisa, fui contaminada pelos pensamentos de autores como Anna Tsing, Donna Haraway, Emanuele Coccia, John Cage, Merlin Sheldrake, Paul Stamets, Peter McCoy [e tantes outres] que também foram, de alguma forma, transformades por esses encontros.

  O movimento micelial segue existindo em seus próprios fluxos.
  Para colaborar com este imaginário fúngico, espalhe seus [esporos@fluxusfungus.com](mailto:esporos@fluxusfungus.com).
title_en: contaminations
content_en: |-
  *What if our indeterminate life form was not the shape of our bodies but rather the shape of our motions over time? Such indeterminacy expands our concept of human life, showing us how we are transformed by encounter. Humans and fungi share such here-and-now transformations through encounter. Sometimes they encounter each other.* [Anna Tsing]


  My fascination with fungi was initially visual. As I go deeper into this universe, I realize that the mystery that surrounds it also intensifies - and my enchantment expands. Throughout this walk through the forest that involves my research, I was contaminated by the thoughts of authors like Anna Tsing, Donna Haraway, Emanuele Coccia, John Cage, Merlin Sheldrake, Paul Stamets, Peter McCoy [and so many others] who were also, somehow, transformed by these encounters.

  The mycelial movement continues to exist in its own flows.
  To collaborate with this fungal imaginary, spread your [esporos@fluxusfungus.com](mailto:esporos@fluxusfungus.com)
