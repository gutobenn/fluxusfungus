<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Estudos de micélio · fluxus fungus</title></head>
<body>
  <div class="site-nav is-visible" style="display:block;width:100%;height:auto;inset:0 0 auto;padding:28px 42px;color:#eee;font-family:monospace"><div>fluxus fungus</div><div id="title" style="margin-top:14px;font-size:18px;font-weight:normal"></div></div>
  <div id="sketch"></div>
  <output id="opened" style="position:absolute;bottom:15px;left:20px"></output>
  <script type="module">
    import P5 from "p5";
    import "../../src/styles/site.css";
    import { startMycelium } from "../../src/scripts/mycelium.js";
    import { MYCELIUM_STUDIES } from "../../src/scripts/mycelium-growth.js";
    const preset = new URLSearchParams(location.search).get("preset") || "balanced";
    document.getElementById("title").textContent = MYCELIUM_STUDIES[preset]?.title || preset;
    window.sketch = startMycelium(P5, document.getElementById("sketch"), {
      preset, seed: "fluxus-comparison-2026",
      posts: Array.from({length:10},(_,index)=>({id:String(index+1)})),
      strings: {next:"mais fluxus »",end:"o micélio parou por aqui",restart:"rever fluxus »"},
      hasNextPage:true,
      showPost(id){document.getElementById("opened").textContent=`Item ${id}`},
      nextPage(){document.getElementById("opened").textContent="Próxima página"},
      goToFirstPage(){}
    });
  </script>
</body>
</html>
